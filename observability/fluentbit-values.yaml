# fluent/fluent-bit 0.58.2 (Fluent Bit 5.1.2), installed by make logging.
kind: DaemonSet
# Collect from the control-plane too, regardless of its scheduling taint.
tolerations:
  - operator: Exists
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
testFramework:
  enabled: false
# kind uses containerd: container log symlinks resolve under /var/log/pods.
daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
extraVolumes:
  - name: state
    emptyDir: {}
extraVolumeMounts:
  - name: state
    mountPath: /fluent-bit/state
config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        DB /fluent-bit/state/tail.db
        Read_from_Head On
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log On
        Labels On
        Annotations Off
  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki.monitoring.svc.cluster.local
        Port 3100
        Labels namespace=$kubernetes['namespace_name'],pod=$kubernetes['pod_name'],container=$kubernetes['container_name'],app=$kubernetes['labels']['app.kubernetes.io/name']
        Auto_Kubernetes_Labels Off
        Line_Format json
        Retry_Limit False
