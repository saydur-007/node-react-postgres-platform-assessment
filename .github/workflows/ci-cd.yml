name: CI/CD

on:
  push:
    branches:
      - master
      - "pre-release/v*"
      - "release/v*"
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to redeploy"
        required: true
        type: choice
        options:
          - dev
          - preprod
          - release
      image_tag:
        description: "Previous image tag to redeploy, e.g. master-abc1234 (see package versions on GHCR)"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  build-and-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: node --check src/index.js

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  build-and-push:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
    steps:
      - uses: actions/checkout@v4

      # Tag = <branch-name>-<short-sha> so every image is traceable back to
      # the exact commit and branch that produced it.
      - name: Compute image tag and target namespace
        id: meta
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          case "${GITHUB_REF_NAME}" in
            master) echo "namespace=dev" >> "$GITHUB_OUTPUT" ;;
            pre-release/v*) echo "namespace=preprod" >> "$GITHUB_OUTPUT" ;;
            release/v*) echo "namespace=release" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is short-lived and scoped to this repo/run only - no
      # long-lived registry credentials are stored anywhere in the repo.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.namespace }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-to-kind
        with:
          namespace: ${{ needs.build-and-push.outputs.namespace }}
          image-tag: ${{ needs.build-and-push.outputs.tag }}
          registry: ${{ env.REGISTRY }}
          image-backend: ${{ env.IMAGE_BACKEND }}
          image-frontend: ${{ env.IMAGE_FRONTEND }}
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          db-user: ${{ secrets.DB_USER }}
          db-password: ${{ secrets.DB_PASSWORD }}
          db-name: ${{ secrets.DB_NAME }}

  # workflow_dispatch only. Spins up its own fresh ephemeral cluster (same
  # as `deploy`) and redeploys a specific previously-built GHCR tag through
  # the same steps - the "precise" rollback path. `kubectl rollout undo` is
  # the "fast" path, but it only makes sense against a real, already-running
  # cluster with deployment history; this job's cluster never has any, so
  # that path isn't wired up here - see the README for running it directly
  # against a live cluster.
  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-to-kind
        with:
          namespace: ${{ inputs.environment }}
          image-tag: ${{ inputs.image_tag }}
          registry: ${{ env.REGISTRY }}
          image-backend: ${{ env.IMAGE_BACKEND }}
          image-frontend: ${{ env.IMAGE_FRONTEND }}
          github-actor: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          db-user: ${{ secrets.DB_USER }}
          db-password: ${{ secrets.DB_PASSWORD }}
          db-name: ${{ secrets.DB_NAME }}
