services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: "4000"
      DB_WRITE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_READ_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      SEARCH_URL: http://opensearch:9200
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node", "src/worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  # Dev only: security plugin disabled (no TLS/auth) and no volume (data is
  # disposable) - see k8s/base/search-deployment.yaml for the same setup.
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    expose:
      - "9200"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # Fixed by the compose network topology, not a secret - that's why it
      # lives here instead of .env. k8s will set this same var to
      # http://backend-service:4000 via its own manifest, same image.
      BACKEND_URL: http://backend:4000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
