# Required by the StatefulSet as its serviceName - gives each pod a stable
# per-ordinal DNS name (postgres-0.postgres-headless.<namespace>.svc.cluster.local).
# Not what clients should connect to; see postgres-service.yaml for that.
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: node-react-postgres-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
