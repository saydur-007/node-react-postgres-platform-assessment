apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  labels:
    app.kubernetes.io/name: search
    app.kubernetes.io/part-of: node-react-postgres-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search
        app.kubernetes.io/part-of: node-react-postgres-platform
    spec:
      containers:
        - name: search
          image: opensearchproject/opensearch:3.9.0
          env:
            - name: discovery.type
              value: single-node
            # Dev only: disables the security plugin (TLS + auth) so the
            # backend can call plain http://search-service:9200 with no
            # credentials. Never do this outside local/dev.
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # No volume/PVC: ephemeral container storage only, dev data is
          # disposable. Memory sized above the 512m heap (OPENSEARCH_JAVA_OPTS)
          # to leave room for JVM/off-heap overhead.
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1Gi
