apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace here on purpose - each overlay owns its own Namespace
# resource and sets kustomization.yaml's `namespace:` field, so the same
# base renders into dev/preprod/release without edits.
resources:
  - app-configmap.yaml
  - postgres-headless-service.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - bullmq-worker-deployment.yaml
  - hpa-backend.yaml
