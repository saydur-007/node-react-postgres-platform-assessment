apiVersion: apps/v1
kind: Deployment
metadata:
  name: bullmq-worker
  labels:
    app.kubernetes.io/name: bullmq-worker
    app.kubernetes.io/part-of: node-react-postgres-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bullmq-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bullmq-worker
        app.kubernetes.io/part-of: node-react-postgres-platform
    spec:
      containers:
        - name: bullmq-worker
          image: backend:dev
          imagePullPolicy: IfNotPresent
          command: ["node", "src/worker.js"]
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: REDIS_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
