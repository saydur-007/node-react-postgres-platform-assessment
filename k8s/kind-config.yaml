kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: devops-assessment
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
         # 80/443 are mapped for the ingress-nginx controller, which is pinned to this node
      # Task 2's NodePort frontend.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
