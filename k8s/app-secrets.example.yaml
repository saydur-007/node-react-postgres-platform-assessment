# Reference only - shows the shape of the "app-secrets" Secret the backend
# and postgres StatefulSet expect. Never apply this file directly: run
# `make secrets`, which reads the real values from the root .env and
# generates the live Secret via
#   kubectl create secret generic app-secrets -n dev --from-literal=... \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dev
  labels:
    app.kubernetes.io/part-of: node-react-postgres-platform
type: Opaque
stringData:
  POSTGRES_USER: changeme
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: changeme
  DB_WRITE_URL: postgres://changeme:changeme@postgres-service:5432/changeme
  DB_READ_URL: postgres://changeme:changeme@postgres-service:5432/changeme
