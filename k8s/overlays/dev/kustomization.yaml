apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../../base
  - namespace.yaml

# No image override and no ingress-host patch: base already uses
# backend:dev/frontend:dev and host node-react.local, which are exactly
# the local values this overlay needs. CI overrides the image tags for
# preprod/release in its own (uncommitted) workspace copy - see the
# workflow and the other two overlays.
